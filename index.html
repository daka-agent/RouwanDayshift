<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0c">
<meta name="description" content="地球这头的白班。玉兔不知道摄像头是什么，你替它把镜头擦干净。">
<title>肉丸值白班</title>
<style>
:root{
  --bg:#0a0b0c; --paper:#d8d2c4; --paper-dim:#8a857a;
  --amber:#d9a441; --moon:#6f7d92; --hud:#9fe8b0; --line:#1c2120;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--paper);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:34px;-webkit-tap-highlight-color:transparent}
#app{max-width:720px;margin:0 auto;padding:18px 14px 30px}

/* ---------- 头部 ---------- */
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.title{font-size:17px;font-weight:500;letter-spacing:.14em;color:#e6ece9}
.date{font-size:12px;color:var(--paper-dim);font-family:ui-monospace,Menlo,Consolas,monospace}
.clocks{display:flex;gap:14px;align-items:baseline;margin-bottom:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.clock{color:var(--paper-dim)}
.clock.moon{color:var(--moon)}

/* ---------- 主画面 ---------- */
.scene{position:relative;width:100%;aspect-ratio:688/482;background:#000;overflow:hidden;
  border:1px solid var(--line);border-radius:3px}
/* 镜头脏度 → 滤镜。数值由 JS 按 lens 连续插值（视觉值 = lens × 1.55） */
.bg{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;z-index:1;
  image-rendering:pixelated;transition:filter .9s ease;
  filter:brightness(var(--b,1.5)) contrast(var(--c,1.06)) saturate(var(--s,1.22)) blur(var(--bl,0px))}
.smear{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;
  opacity:0;transition:opacity .9s ease;
  background:
    radial-gradient(70px 50px at 16% 28%,rgba(214,218,226,.55),transparent 68%),
    radial-gradient(52px 40px at 73% 20%,rgba(205,210,220,.48),transparent 68%),
    radial-gradient(90px 64px at 56% 66%,rgba(218,222,230,.40),transparent 70%),
    radial-gradient(38px 32px at 87% 76%,rgba(210,214,224,.52),transparent 68%),
    radial-gradient(44px 34px at 34% 82%,rgba(206,212,222,.42),transparent 68%)}
.dust{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;
  background-image:radial-gradient(circle,rgba(255,255,255,.55) 1px,transparent 1.6px),
                   radial-gradient(circle,rgba(255,255,255,.3) 1px,transparent 1.6px);
  background-size:37px 41px,61px 53px;background-position:5px 7px,20px 30px;
  opacity:0;transition:opacity .9s ease}
/* 邮筒积灰（数据字段 snap.dust）：CAM-01 才见。
   注意：这是"邮筒上的灰"，与上面 #dust（镜头灰点）是两回事，命名刻意错开。 */
.mboxdust{position:absolute;left:2%;top:18%;width:40%;height:74%;z-index:3;pointer-events:none;
  opacity:0;transition:opacity 1s ease;
  background:
    radial-gradient(58px 38px at 32% 26%,rgba(168,152,116,.55),transparent 68%),
    radial-gradient(46px 42px at 66% 52%,rgba(158,144,110,.5),transparent 68%),
    radial-gradient(64px 46px at 44% 78%,rgba(150,138,106,.45),transparent 70%),
    radial-gradient(30px 24px at 18% 62%,rgba(160,148,114,.4),transparent 70%);
  filter:blur(.6px)}

/* 桂花：散落（CAM-02 才见） */
.leaves{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .6s ease}
.scene.is-cam2 .leaves{opacity:1}
.leaves i{position:absolute;display:block;width:7px;height:5px;background:#d6b23e;
  border-radius:60% 40% 55% 45%;
  box-shadow:0 0 3px rgba(214,178,62,.5),inset 0 -1px 0 rgba(120,90,20,.55);opacity:.95}
/* 扫完的花堆：堆在树根左边，不扔 */
.pile{position:absolute;left:11%;top:84%;width:13%;height:9%;z-index:4;pointer-events:none;
  opacity:0;transition:opacity .8s ease}
.scene.is-cam2.has-pile .pile{opacity:1}
.pile i{position:absolute;display:block;width:7px;height:5px;background:#d6b23e;border-radius:60% 40% 55% 45%;
  box-shadow:0 0 3px rgba(214,178,62,.5),inset 0 -1px 0 rgba(120,90,20,.55)}
/* 扫过的净弧 */
.fx-sweep{position:absolute;left:6%;top:68%;width:56%;height:32%;z-index:3;pointer-events:none;
  opacity:0;transition:opacity 1.2s ease;
  background:radial-gradient(ellipse at 32% 62%,rgba(255,244,214,.17),transparent 62%)}
.scene.is-cam2.is-swept .fx-sweep{opacity:1}

/* 灯油：连续量，oil 越高越暖 */
.warmth{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:screen;
  background:rgba(255,182,92,.10);opacity:0;transition:opacity 1.2s ease}
.lightpool{position:absolute;left:42%;top:54%;width:48%;height:44%;z-index:5;pointer-events:none;
  opacity:0;transition:opacity 1.1s ease;
  background:radial-gradient(ellipse at 55% 55%,rgba(255,198,112,.42),rgba(255,180,90,.15) 55%,transparent 76%)}
.lampglow{position:absolute;left:55%;top:36%;width:18%;height:30%;z-index:6;pointer-events:none;
  opacity:0;transition:opacity .9s ease}
.lampglow i{position:absolute;left:36%;top:32%;width:28%;height:34%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,240,196,.95),rgba(255,198,96,.6) 52%,transparent 74%);
  animation:flick 2.2s ease-in-out infinite}
.lampglow::before{content:"";position:absolute;inset:-130%;
  background:radial-gradient(circle,rgba(255,205,110,.5),rgba(255,180,80,.16) 46%,transparent 70%);
  animation:flick 2.2s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1);filter:brightness(1)}38%{transform:scale(1.06);filter:brightness(1.16)}62%{transform:scale(.98);filter:brightness(.92)}}
.flies{position:absolute;left:59%;top:38%;width:14%;height:26%;z-index:7;pointer-events:none;
  opacity:0;transition:opacity .9s ease}
.flies i{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;
  background:#ffe9ad;box-shadow:0 0 4px rgba(255,233,173,.9);animation:orbit 3.4s linear infinite}
.flies i:nth-child(2){width:2px;height:2px;animation-duration:4.6s;animation-delay:-1.2s}
.flies i:nth-child(3){animation-duration:5.8s;animation-delay:-2.6s}
@keyframes orbit{from{transform:rotate(0turn) translateX(30px) rotate(0turn)}to{transform:rotate(1turn) translateX(30px) rotate(-1turn)}}

/* 监控质感 */
.scene::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1.5px,rgba(0,0,0,0) 1.5px 3px)}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(0,0,0,.55) 100%)}
/* 交班：画面暗一点，像没人看了 */
.scene.is-off .bg{transition:filter .9s ease,opacity 1.2s ease;opacity:.82}

/* 画中画：肉丸（终端屏） */
.pip{position:absolute;right:10px;bottom:10px;z-index:9;width:56px;height:114px;
  background:rgba(8,9,11,.82);border:1px solid #262b2a;border-radius:2px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.6), inset 0 0 12px rgba(159,232,176,.06);
  transition:opacity .8s ease}
.pip::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,rgba(0,0,0,0) 1px 2.4px)}
.pip::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  box-shadow:inset 0 0 6px rgba(0,0,0,.8)}
.pip img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  height:104px;width:auto;display:block;opacity:.96;
  filter:drop-shadow(0 0 4px rgba(159,232,176,.12));transition:transform .5s ease,opacity .5s ease}
.pip .sig{position:absolute;left:4px;top:3px;z-index:4;width:4px;height:4px;border-radius:50%;
  background:var(--hud);animation:blink 1.4s linear infinite}
/* 空班：屏幕黑着，人不在 */
.scene.is-empty .pip{opacity:.18}
.scene.is-empty .pip img{opacity:0}
/* 交班：白班的人走了，终端屏幕还在待机（画面停在最后一帧，是档案） */
.scene.is-off .pip{opacity:.3}
.scene.is-off .pip img{opacity:0}
/* 档案陈旧：实时信号断了，只剩余旧档案 */
.scene.is-stale .pip{opacity:.16}
.scene.is-stale .pip img{opacity:0}
.scene.is-empty .pip .sig,
.scene.is-off .pip .sig,
.scene.is-stale .pip .sig{animation:none;opacity:.18}
/* 姿态降级（规格 8.2）：不画动作帧，用 transform 区分 */
.pip.pose-squat img{transform:translateX(-50%) translateY(7px) scaleY(.93)}
.pip.pose-walk img{transform:translateX(-50%) rotate(-2deg) translateY(1px)}
.pip.pose-stand img{transform:translateX(-50%)}
.pip.act-wipe img{animation:pWipe 1.2s ease}
.pip.act-oil img{animation:pOil 1.2s ease}
.pip.act-sweep img{animation:pSweep 1.2s ease}
@keyframes pWipe{0%,100%{transform:translateX(-50%)}30%{transform:translateX(-58%) rotate(-4deg)}60%{transform:translateX(-42%) rotate(4deg)}}
@keyframes pOil{0%,100%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(7px) scaleY(.94)}}
@keyframes pSweep{0%,100%{transform:translateX(-50%) rotate(0)}35%{transform:translateX(-50%) rotate(-7deg) translateY(3px)}65%{transform:translateX(-50%) rotate(5deg) translateY(3px)}}

/* HUD */
.hud{position:absolute;inset:0;z-index:10;pointer-events:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;
  letter-spacing:.06em;color:var(--hud);text-shadow:0 1px 2px rgba(0,0,0,.9)}
.hud-tl{position:absolute;left:9px;top:8px}
.hud-tr{position:absolute;right:9px;top:8px}
.hud-bl{position:absolute;left:9px;bottom:8px}
.hud-bl .rec{animation:blink 1.4s linear infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
/* HUD 右上三态语义：有活动（正在干活）/ 在岗（人在班上，此刻没动）/
   无人（空班或已交班）/ 离线（档案陈旧，没有实时信号） */
#hudAct{transition:color .6s ease}
#hudAct.hud-live{color:var(--hud)}
#hudAct.hud-idle{color:#6c9a7b}
#hudAct.hud-none{color:#5f6663}
#hudAct.hud-off{color:#4a524f}
.stale{position:absolute;left:9px;top:26px;z-index:10;font-family:ui-monospace,monospace;
  font-size:10px;color:#8a8f8c}

/* 动作瞬间 */
.flash{position:absolute;inset:0;z-index:14;pointer-events:none;background:#fff;opacity:0}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:0}16%{opacity:.7}100%{opacity:0}}
.wipe{position:absolute;left:-6%;width:112%;height:26%;top:-30%;z-index:13;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.45) 45%,rgba(255,255,255,.72) 56%,transparent);
  filter:blur(3px)}
.wipe.go{animation:wipe 1s ease-in}
@keyframes wipe{0%{top:-30%;opacity:.9}100%{top:112%;opacity:.15}}
.notice{position:absolute;left:50%;top:12%;transform:translateX(-50%);z-index:15;pointer-events:none;
  font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.14em;color:var(--hud);
  background:rgba(6,8,8,.74);border:1px solid #2c3a30;padding:5px 12px;border-radius:2px;
  opacity:0;transition:opacity .4s ease;white-space:nowrap}
.notice.go{opacity:1}

/* ---------- 机位 ---------- */
.cams{display:flex;gap:6px;margin-top:10px}
.cams button{flex:1;padding:7px 2px;background:transparent;border:1px solid var(--line);
  border-radius:3px;color:var(--paper-dim);font-size:12px;letter-spacing:.06em;cursor:pointer;
  font-family:inherit;transition:border-color .15s,color .15s}
.cams button:hover{border-color:#3a403e;color:var(--paper)}
.cams button.on{border-color:var(--amber);color:var(--amber)}
.cams button b{font-family:ui-monospace,monospace;font-weight:400;opacity:.7;margin-right:4px}
.cams button em{display:block;font-style:normal;font-family:ui-monospace,monospace;font-size:9px;
  color:#4a524f;margin-top:2px;letter-spacing:.04em}
.cams button.on em{color:#8a7a4a}

/* ---------- 痕迹 ---------- */
.traces{margin-top:22px}
.traces h2,.log h2,.help h2{font-size:12px;font-weight:400;color:var(--paper-dim);
  letter-spacing:.18em;margin-bottom:10px}
.traces h2::before,.log h2::before,.help h2::before{content:"── ";color:#3a403e}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trace{border:1px solid var(--line);border-radius:3px;padding:10px 10px 12px;min-height:96px;
  animation:fadein .5s ease}
.trace .tn{font-size:12px;color:var(--paper);margin-bottom:6px;letter-spacing:.04em}
.trace .tt{font-size:11px;line-height:1.8;color:var(--paper-dim)}
.trace .tc{font-family:ui-monospace,monospace;font-size:9px;color:#4a524f;margin-top:8px}
/* 还没有痕迹时的空槽：虚线框，什么都不说 —— 空槽本身就在说"今天还没留下什么" */
.trace.trace-empty{border-style:dashed;border-color:#272c2a;display:flex;
  align-items:center;justify-content:center;animation:none}
.trace.trace-empty .tn{color:#2e3432;margin:0;font-family:ui-monospace,monospace}

/* ---------- 值班本 ---------- */
.log{margin-top:22px}
.log ol{list-style:none;border:1px solid var(--line);border-radius:3px;
  padding:10px 14px;font-family:"Kaiti SC","KaiTi","STKaiti",serif}
.log-row{display:grid;grid-template-columns:64px 44px 1fr;gap:10px;
  padding:5px 0;font-size:14px;line-height:1.7;color:var(--paper);
  border-bottom:1px dashed rgba(28,33,32,.7)}
.log-row:last-child{border-bottom:none}
.log-row .t{font-family:ui-monospace,monospace;font-size:12px;color:var(--paper-dim);padding-top:3px}
.log-row .w{color:var(--moon);font-size:13px}
.log-row.new{animation:fadein .6s ease}
.log-empty{font-family:"Kaiti SC","KaiTi","STKaiti",serif;font-size:14px;color:#5a605c;
  padding:8px 0;letter-spacing:.2em;text-align:center}
@keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* ---------- 帮工 ---------- */
.help{margin-top:22px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts button{padding:8px 14px;background:transparent;border:1px solid #3a403e;border-radius:3px;
  color:var(--paper);font-size:12.5px;font-family:inherit;cursor:pointer;letter-spacing:.04em;
  transition:border-color .15s,color .15s}
.acts button:hover{border-color:var(--amber);color:var(--amber)}
.acts button.done{border-style:dashed;border-color:#2a2f2e;color:#4a524f;cursor:default}

/* ---------- 页脚 ---------- */
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;
  font-family:ui-monospace,monospace;font-size:11px;color:#4a524f}
.foot button{background:transparent;border:1px solid var(--line);color:#4a524f;
  font-size:10px;padding:3px 8px;border-radius:2px;cursor:pointer;font-family:inherit}
.foot button:hover{color:var(--paper-dim);border-color:#3a403e}

/* ---------- 署名与互链 ---------- */
.sign{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 14px;
  font-family:ui-monospace,monospace;font-size:11px;color:#4a524f}
.sign .sig-line{letter-spacing:.16em}
.sign nav{display:flex;gap:14px;flex-wrap:wrap}
.sign a{color:#5a6a60;text-decoration:none;border-bottom:1px dashed #2a2f2e;padding-bottom:1px;
  transition:color .15s,border-color .15s}
.sign a:hover{color:var(--amber);border-color:var(--amber)}

/* ---------- 移动端竖屏 ---------- */
@media(max-width:520px){
  #app{padding:14px 10px calc(16px + env(safe-area-inset-bottom))}
  .title{font-size:15px;letter-spacing:.1em}
  .clocks{margin-bottom:10px;gap:10px}
  /* 画面不变比例，靠满宽；HUD 字号略收 */
  .hud{font-size:10px}
  .notice{font-size:11px;padding:4px 9px;white-space:normal;max-width:86%;text-align:center}
  .pip{width:40px;height:82px;right:6px;bottom:6px}
  .pip img{height:74px}
  /* 机位：三列等宽、触控高 ≥44px */
  .cams{gap:5px;margin-top:8px}
  .cams button{padding:11px 2px;border-radius:2px}
  .cams button em{font-size:8.5px;margin-top:3px}
  /* 痕迹：两列 */
  .tgrid{grid-template-columns:repeat(2,1fr);gap:6px}
  .trace{min-height:0;padding:9px 9px 11px}
  .trace:last-child{grid-column:span 2}
  .trace .tt{line-height:1.7}
  .traces,.log,.help{margin-top:18px}
  /* 值班本 */
  .log ol{padding:8px 10px}
  .log-row{grid-template-columns:52px 40px 1fr;gap:8px;font-size:13.5px;line-height:1.65}
  /* 帮工：两列大按钮，触控友好 */
  .acts{gap:7px}
  .acts button{flex:1 1 calc(50% - 4px);min-height:46px;padding:11px 8px;font-size:13.5px;
    -webkit-touch-callout:none;user-select:none;touch-action:manipulation}
  .foot{margin-top:16px}
  .sign{margin-top:20px;padding-top:10px;flex-direction:column;align-items:flex-start;gap:8px}
}
@media(max-width:360px){
  .acts button{flex:1 1 100%}
  .clocks{font-size:11px}
  .log-row{font-size:13px}
}
/* 触屏：去掉 hover 依赖，按下即有反馈 */
@media(hover:none){
  .acts button:active{border-color:var(--amber);color:var(--amber)}
  .cams button:active{border-color:var(--amber);color:var(--amber)}
}
</style>
</head>
<body>
<div id="app">

  <header class="head">
    <h1 class="title">肉丸值白班</h1>
    <div class="date" id="dateTxt">—</div>
  </header>

  <div class="clocks">
    <span class="clock" id="earthClock">地球 —</span>
    <span class="clock moon" id="moonClock">它那边 —</span>
  </div>

  <div class="scene" id="scene">
    <img class="bg" id="bg" alt="">
    <div class="smear" id="smear"></div>
    <div class="dust" id="dust"></div>
    <div class="mboxdust" id="mboxdust"></div>
    <div class="fx-sweep"></div>
    <div class="leaves" id="leaves"></div>
    <div class="pile" id="pile"></div>
    <div class="warmth" id="warmth"></div>
    <div class="lightpool" id="lightpool"></div>
    <div class="lampglow" id="lampglow"><i></i></div>
    <div class="flies"><i></i><i></i><i></i></div>

var RD = window.__RD__ || [];

/* ══════════════════════ 时间 ══════════════════════ */
function p2(n){ return n < 10 ? "0" + n : "" + n; }
function isoOf(d){ return d.getFullYear() + "-" + p2(d.getMonth()+1) + "-" + p2(d.getDate()); }
function slotOf(d){ return Math.floor(d.getHours() / 4); }
function minInSlot(d){ return (d.getHours() % 4) * 60 + d.getMinutes(); }
function slotRange(s){
  return [[0,4],[4,8],[8,12],[12,16],[16,20],[20,24]][s];
}
var WEEK = ["日","一","二","三","四","五","六"];

/* ══════════════════════ 取日 ══════════════════════ */
function pickDay(now){
  var t = isoOf(now);
  for (var i = 0; i < RD.length; i++) if (RD[i].date === t) return {day:RD[i], stale:false};
  // 今天不在数据里：显示最后一天，标「档案陈旧」
  return {day:RD[RD.length-1], stale:true};
}

/* 当前该看第几个快照 —— snaps 的索引 */
function snapIndex(day, now){
  if (!day.onDuty) return 0;
  var s = slotOf(now), m = minInSlot(now), n = 0;
  for (var i = 0; i < day.shifts.length; i++){
    var sh = day.shifts[i];
    if (sh.slot < s) n++;
    else if (sh.slot === s && m >= sh.to) n++;
  }
  return Math.min(n, day.snaps.length - 1);
}

/* 当前是否正在做某个动作 */
function liveShift(day, now){
  var s = slotOf(now), m = minInSlot(now);
  for (var i = 0; i < day.shifts.length; i++){
    var sh = day.shifts[i];
    if (sh.slot === s && m >= sh.from && m <= sh.to) return sh;
  }
  return null;
}

/* 三态：onduty / off（已交班）/ empty（空班）/ stale */
function dayState(day, now, stale){
  if (stale) return "stale";
  if (!day.onDuty) return "empty";
  var s = slotOf(now);
  if (s === 2 || s === 3 || s === 4) return "onduty";
  return "off";
}

/* ══════════════════════ 本地存储 ══════════════════════ */
function keyActs(){ return "rd_acts_" + CUR.date }
function loadActs(){
  try{ return JSON.parse(localStorage.getItem(keyActs()) || "{}") }catch(e){ return {} }
}
function saveActs(o){
  try{ localStorage.setItem(keyActs(), JSON.stringify(o)) }catch(e){}
}
/* 你擦过的镜头：跨天记得两天（规矩：你不在，活照样有人接） */
function loadCare(){
  try{ return JSON.parse(localStorage.getItem("rd_care") || "{}") }catch(e){ return {} }
}
function saveCare(o){
  try{ localStorage.setItem("rd_care", JSON.stringify(o)) }catch(e){}
}

/* ══════════════════════ 状态 ══════════════════════ */
var NOW = new Date();
var picked = pickDay(NOW);
var CUR = picked.day;
var STATE = dayState(CUR, NOW, picked.stale);
var snap = null;          // 当前工作副本（会在帮工后改写）
var curCam = null;
var done = {};

/* ══════════════════════ 渲染 ══════════════════════ */
function $(id){ return document.getElementById(id); }

function initState(){
  // 交班 / 陈旧：画面停在最后一帧（档案是完整的，不按此刻切）
  var idx = (STATE === "off" || STATE === "stale")
    ? CUR.snaps.length - 1
    : snapIndex(CUR, NOW);
  snap = JSON.parse(JSON.stringify(CUR.snaps[idx]));
  done = loadActs();

  // 跨天关怀：你昨天擦过的镜头，今天还算干净一点
  var care = loadCare(), today = new Date(isoOf(NOW));
  CAMS.forEach(function(c){
    var d = care[c.id];
    if (!d) return;
    var gap = Math.round((today - new Date(d)) / 86400000);
    if (gap === 0) snap.lens[c.id] = Math.min(snap.lens[c.id], 0.05);
    else if (gap === 1) snap.lens[c.id] = Math.min(snap.lens[c.id], 0.12);
  });

  // 今天已经点过的动作，重放一遍（刷新后画面不能和按钮矛盾）
  ACTS.forEach(function(a){
    if (!done[a.id]) return;
    if (a.id === "oil") snap.oil = 1;
    else if (a.id === "sweep") snap.fallen = 0;
    else if (a.id === "dustbox") snap.dust = 0.02;
    else snap.lens[a.id] = 0.05;
  });

  // 初始机位：此刻在干活的机位 → 最后一件事的机位 → CAM-01
  // 只有"正在白班"才按此刻判；交班/陈旧看档案最后一件事落在哪台
  var live = (STATE === "onduty") ? liveShift(CUR, NOW) : null;
  if (live) curCam = live.cam;
  else if (CUR.shifts.length) {
    var last = CUR.shifts[CUR.shifts.length - 1];
    curCam = (STATE === "onduty") ? CUR.shifts[Math.max(0, snapIndex(CUR, NOW) - 1)].cam : last.cam;
  } else curCam = "CAM-01";
  if (!curCam) curCam = "CAM-01";
}

/* 镜头的视觉脏度：数据里的 lens（0–0.5）直接渲染太轻，看不出来。
   分两段：擦净（≤0.08）压到底保证"变清楚"能看出来；有灰就起步 0.28 保证"脏"能看出来。 */
function visualDirty(lens){
  if (lens <= 0.08) return lens * 0.6;
  return Math.min(1, 0.28 + (lens - 0.08) * 1.5);
}

function applyView(){
  var d = visualDirty(snap.lens[curCam] || 0);
  var s = $("scene");

  // 滤镜：脏 = 糊 + 灰 + 发白
  s.style.setProperty("--b", (1.50 + 0.10 * d).toFixed(3));
  s.style.setProperty("--c", (1.06 - 0.44 * d).toFixed(3));
  s.style.setProperty("--s", (1.22 - 0.66 * d).toFixed(3));
  s.style.setProperty("--bl", (2.4 * d).toFixed(2) + "px");
  $("dust").style.opacity = (0.05 + 0.50 * d).toFixed(2);
  $("smear").style.opacity = (d > 0.12 ? d * 0.9 : 0).toFixed(2);

  // 邮筒积灰：只跟 snap.dust 走，CAM-01 才看得见（层常在，机位切走自然被盖住）
  var md = Math.min(1, (snap.dust || 0) * 1.35);
  $("mboxdust").style.opacity = md.toFixed(2);

  // 灯：连续量
  s.classList.toggle("is-lit", snap.oil > 0.05);
  $("warmth").style.opacity = (snap.oil * 0.9).toFixed(2);
  $("lightpool").style.opacity = (snap.oil * 0.95).toFixed(2);
  $("lampglow").style.opacity = (snap.oil > 0.1 ? Math.min(1, snap.oil * 1.1) : 0).toFixed(2);
  document.querySelector(".flies").style.opacity = (snap.oil > 0.5 ? 1 : 0).toFixed(2);

  // 机位 / 桂花
  s.classList.toggle("is-cam1", curCam === "CAM-01");
  s.classList.toggle("is-cam2", curCam === "CAM-02");
  s.classList.toggle("is-swept", snap.fallen === 0);
  s.classList.toggle("has-pile", snap.fallen === 0);

  // 三态
  s.classList.toggle("is-empty", STATE === "empty");
  s.classList.toggle("is-off", STATE === "off");
  s.classList.toggle("is-stale", STATE === "stale");
}

function renderLeaves(){
  var box = $("leaves"), pile = $("pile");
  box.innerHTML = ""; pile.innerHTML = "";
  var n = Math.min(snap.fallen || 0, 18);
  // 确定性散布：同样的 falln 数每次位置一致，不跳动
  for (var i = 0; i < n; i++){
    var el = document.createElement("i");
    var rx = ((i * 37) % 47) / 47, ry = ((i * 61) % 31) / 31;
    el.style.left = (28 + rx * 48).toFixed(1) + "%";
    el.style.top  = (62 + ry * 32).toFixed(1) + "%";
    el.style.transform = "rotate(" + ((i * 23) % 70 - 35) + "deg)";
    box.appendChild(el);
  }
  if (snap.fallen === 0){
    for (var j = 0; j < 12; j++){
      var q = document.createElement("i");
      q.style.left = (j % 4) * 16 + "%";
      q.style.top  = Math.floor(j / 4) * 22 + "%";
      q.style.transform = "rotate(" + ((j * 17) % 60 - 30) + "deg)";
      pile.appendChild(q);
    }
  }
}

function renderCams(){
  var box = $("cams"); box.innerHTML = "";
  CAMS.forEach(function(c){
    var lens = snap.lens[c.id] || 0;
    var b = document.createElement("button");
    b.innerHTML = "<b>" + c.id.replace("CAM-0", "") + "</b>" + c.name +
      "<em>" + (lens <= 0.08 ? "CLEAR" : "DUST " + Math.round(lens * 100) + "%") + "</em>";
    b.className = (c.id === curCam) ? "on" : "";
    b.onclick = function(){ curCam = c.id; render(); };
    box.appendChild(b);
  });
  $("hudCam").textContent = curCam + " " + (CAMS.filter(function(c){ return c.id === curCam; })[0] || {}).name;
}

function renderTraces(){
  var g = $("tgrid"); g.innerHTML = "";
  var nowMin = NOW.getHours() * 60 + NOW.getMinutes();
  // 痕迹是做完才留下的：只显示此刻之前已经发生的。
  // 交班、档案陈旧时档案是完整的，全部显示。
  var whole = (STATE === "off" || STATE === "stale");
  var list = (CUR.traces || []).filter(function(t){
    return whole || !t.at || hmToMin(t.at) <= nowMin;
  });
  if (!list.length){
    var e = document.createElement("div");
    e.className = "trace trace-empty";
    e.innerHTML = '<div class="tn">—</div>';
    g.appendChild(e);
    return;
  }
  list.forEach(function(t){
    var d = document.createElement("div");
    d.className = "trace";
    d.innerHTML = '<div class="tn">' + t.name + '</div><div class="tt">' + t.text +
                  '</div><div class="tc">' + t.cam + (t.at ? ' · ' + t.at : '') + '</div>';
    g.appendChild(d);
  });
}

function hmToMin(t){ var a = t.split(":"); return parseInt(a[0], 10) * 60 + parseInt(a[1], 10); }

/* 此刻已经"看得见"的值班本行数与痕迹条数。
   页面开着不动时，这两样会随时间增加 —— 定时器靠它判断要不要重绘，
   不重绘就不会每分钟重播一次淡入动画。*/
var LASTN = { log: -1, tr: -1 };
function visibleCounts(){
  if (!CUR || !CUR.onDuty) return { log: 0, tr: 0 };
  var nowMin = NOW.getHours() * 60 + NOW.getMinutes();
  var whole = (STATE === "off" || STATE === "stale");
  return {
    log: (CUR.log || []).filter(function(r){ return whole || hmToMin(r.t) <= nowMin; }).length,
    tr:  (CUR.traces || []).filter(function(t){ return whole || !t.at || hmToMin(t.at) <= nowMin; }).length
  };
}

function renderLog(){
  var ol = $("logList"); ol.innerHTML = "";
  if (!CUR.onDuty){
    // 空班：只有一行，没有时间、没有内容
    var li = document.createElement("li");
    li.className = "log-empty";
    li.textContent = "—— 白班 ——";
    ol.appendChild(li);
    return;
  }
  var nowMin = NOW.getHours() * 60 + NOW.getMinutes();
  var cut = (STATE === "onduty");     // 还在班：只写到此刻，不提前透露收班
  (CUR.log || []).forEach(function(r){
    if (cut && hmToMin(r.t) > nowMin) return;
    var li = document.createElement("li");
    li.className = "log-row";
    li.innerHTML = '<span class="t">' + r.t + '</span><span class="w">' + r.who +
                   '</span><span>' + r.what + '</span>';
    ol.appendChild(li);
  });
  // 本次会话帮它做的活，接在值班本后面
  Object.keys(done).forEach(function(id){
    var a = ACTS.filter(function(x){ return x.id === id; })[0];
    if (!a) return;
    var li2 = document.createElement("li");
    li2.className = "log-row new";
    var now = new Date();
    li2.innerHTML = '<span class="t">' + p2(now.getHours()) + ":" + p2(now.getMinutes()) +
      '</span><span class="w">白班</span><span>' + a.log + '</span>';
    ol.appendChild(li2);
  });
}

function isActDone(a){
  if (done[a.id]) return true;
  if (a.id === "oil")     return snap.oil >= 0.95;
  if (a.id === "sweep")   return snap.fallen === 0;
  if (a.id === "dustbox") return (snap.dust || 0) <= 0.08;
  return (snap.lens[a.id] || 0) <= 0.08;
}

function renderActs(){
  var box = $("acts"); box.innerHTML = "";
  ACTS.forEach(function(a){
    var b = document.createElement("button");
    b.textContent = a.label;
    if (isActDone(a)) b.classList.add("done");
    b.onclick = function(){
      if (isActDone(a)) return;
      done[a.id] = 1; saveActs(done);
      if (a.id === "oil"){ snap.oil = 1; }
      else if (a.id === "sweep"){ snap.fallen = 0; curCam = "CAM-02"; }
      else if (a.id === "dustbox"){ snap.dust = 0.02; curCam = "CAM-01"; }
      else {
        snap.lens[a.id] = 0.05; curCam = a.id;
        var care = loadCare(); care[a.id] = isoOf(new Date()); saveCare(care);
      }
      flashGo(); showNotice(a.notice);
      if (a.id !== "sweep" && a.id !== "oil") wipeGo();
      render();
      pipPulse(a.id);   // 放在 render 之后，别让重绘吃掉动画
      // 不自动滚动：画面变化才是要点，别把视线拽到值班本去
    };
    box.appendChild(b);
  });
}

function renderFoot(){
  var f = $("footInfo");
  if (STATE === "stale"){ f.textContent = "档案陈旧 · " + CUR.date; return; }
  if (STATE === "empty"){ f.textContent = "今日无人值班"; return; }
  if (STATE === "off")  { f.textContent = "已交班"; return; }
  var s = slotOf(NOW), r = slotRange(s);
  f.textContent = "第 " + s + " 档 · " + p2(r[0]) + ":00–" + p2(r[1]) + ":00";
}

function renderClocks(){
  var s = slotOf(NOW);
  $("earthClock").textContent = "地球 " + NOW.getFullYear() + "-" + p2(NOW.getMonth()+1) + "-" +
    p2(NOW.getDate()) + " " + p2(NOW.getHours()) + ":" + p2(NOW.getMinutes());
  $("moonClock").textContent = "它那边 " + (CUR.moon.lunar === "day" ? "月昼" : "月夜") +
    " · " + CUR.moon.name;
  $("dateTxt").textContent = p2(NOW.getMonth()+1) + "月" + p2(NOW.getDate()) + "日 " +
    "周" + WEEK[NOW.getDay()];
  $("stale").hidden = !picked.stale;
}

function renderPose(){
  var p = $("pip"), hud = $("hudAct");
  // 只换姿态类，不碰 act-* 动画类（否则刚触发的动作动画会被抹掉）
  p.classList.remove("pose-squat", "pose-stand", "pose-walk");
  hud.className = "hud-tr";

  // 空班、已交班、档案陈旧：都没有"此刻在这儿的一个人"可看
  if (STATE === "empty" || STATE === "off" || STATE === "stale"){
    var stale = (STATE === "stale");
    hud.textContent = stale ? "离线" : "无人";
    hud.classList.add(stale ? "hud-off" : "hud-none");
    return;
  }

  var live = liveShift(CUR, NOW);
  if (live){
    if (live.pose === "蹲") p.classList.add("pose-squat");
    else if (live.pose === "走") p.classList.add("pose-walk");
    else p.classList.add("pose-stand");
    hud.textContent = "有活动";
    hud.classList.add("hud-live");
  } else {
    // 在班，只是此刻没在动 —— 这个岗位上有人，这本身就是他要给的
    p.classList.add("pose-stand");
    hud.textContent = "在岗";
    hud.classList.add("hud-idle");
  }
}

function render(){
  $("bg").src = (CAMS.filter(function(c){ return c.id === curCam; })[0] || CAMS[0]).img;
  applyView();
  renderLeaves();
  renderCams();
  renderTraces();
  renderLog();
  renderActs();
  renderFoot();
  renderClocks();
  renderPose();
  LASTN = visibleCounts();
}

/* ══════════════════════ 一次性动画 ══════════════════════ */
function replay(el, cls){
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}
function flashGo(){ replay($("flash"), "go"); }
function wipeGo(){ replay($("wipe"), "go"); }
function showNotice(t){
  var n = $("notice");
  n.textContent = t;
  n.classList.add("go");
  clearTimeout(showNotice._t);
  showNotice._t = setTimeout(function(){ n.classList.remove("go"); }, 1700);
}
function pipPulse(id){
  var p = $("pip");
  var cls = id === "oil" ? "act-oil" : (id === "sweep" ? "act-sweep" : "act-wipe");
  replay(p, cls);  clearTimeout(pipPulse._t);
  pipPulse._t = setTimeout(function(){ p.classList.remove(cls); }, 1300);
}

/* ══════════════════════ 启动 ══════════════════════ */
$("resetBtn").onclick = function(){
  try{
    localStorage.removeItem(keyActs());
    localStorage.removeItem("rd_care");
  }catch(e){}
  location.reload();
};

initState();
render();

// 每分钟对一次表：档位变了、动作区间变了，画面要跟上
setInterval(function(){
  NOW = new Date();
  var np = pickDay(NOW);
  var ns = dayState(np.day, NOW, np.stale);
  if (np.day.date !== CUR.date || ns !== STATE){
    CUR = np.day; STATE = ns; picked = np;
    initState(); render();
  } else {
    renderClocks(); renderFoot(); renderPose();
    // 值班本多了一行、或者刚留下一条新痕迹 —— 只重绘这两块
    var c = visibleCounts();
    if (c.log !== LASTN.log || c.tr !== LASTN.tr){
      LASTN = c;
      renderLog();
      renderTraces();
    }
  }
}, 60000);

})();
</script>
</body>
</html>
